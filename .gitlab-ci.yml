stages:
  - build
  - assemble
  - scan
  - publish
  - deploy
  - merge

variables:
  DOCKER_IMAGE: "dulno-app"
  KUBERNETES_RESOURCE: "deployment/dulno-app-deployment"

build_linux:
  stage: build
  image: instrumentisto/flutter:3.29.1
  script:
    - apt-get update && apt-get install -y libsecret-1-dev libnotify-dev libayatana-appindicator3-dev dpkg-dev gnupg apt-utils gzip
    - flutter config --enable-linux-desktop
    - flutter build linux --release
    - mkdir -p linux/deployment/usr/bin/dulno
    - mv build/linux/x64/release/bundle/* linux/deployment/usr/bin/dulno
    - cd linux
    - chmod -R 755 deployment
    - dpkg-deb --build deployment
    - mv deployment.deb dulno.deb
  artifacts:
    paths:
      - linux/dulno.deb
    expire_in: 1 day

build_android:
  stage: build
  image: instrumentisto/flutter:3.29.0-androidsdk34-r0
  before_script:
    - echo $ANDROID_KEYSTORE_CONTENT | base64 -d > android/app/keystore.jks
  script:
    - yes | flutter doctor --android-licenses || true
    - flutter pub run flutter_native_splash:create
    - flutter build appbundle --release
    - mv build/app/outputs/bundle/release/app-release.aab android/dulno.aab
  artifacts:
    paths:
      - android/dulno.aab
    expire_in: 1 day
  only:
    - main
    - dev

build_windows:
  stage: build
  tags:
    - windows
  script:
    - flutter config --enable-windows-desktop
    - flutter build windows --release
    - Move-Item -Path "build\\windows\\x64\\runner\\Release" -Destination "windows\\deployment\\app"
    - powershell -Command "& 'C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe' windows\\deployment\\dulno.iss"
    - Move-Item -Path "windows\\deployment\\Output\\mysetup.exe" -Destination "windows\\dulno.exe"
  artifacts:
    paths:
      - windows/dulno.exe
    expire_in: 1 day
  only:
    - main
    - dev

assemble_staging:
  stage: assemble
  image: docker:cli
  services:
    - docker:dind
  dependencies:
    - build_linux
    - build_windows
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $STAGING_DOCKER_PASSWORD | docker login -u $STAGING_DOCKER_USERNAME --password-stdin $STAGING_DOCKER_REGISTRY
    - docker buildx build --build-arg SERVER_NAME="10.96.0.13" -t $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:test -f nginx/Dockerfile .
    - docker push $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:test
  only:
    - dev

assemble_productive:
  stage: assemble
  image: docker:cli
  services:
    - docker:dind
  dependencies:
    - build_linux
    - build_windows
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $PRODUCTIVE_DOCKER_PASSWORD | docker login -u $PRODUCTIVE_DOCKER_USERNAME --password-stdin $PRODUCTIVE_DOCKER_REGISTRY
    - docker buildx build --build-arg SERVER_NAME="app.dulno.com" -t $PRODUCTIVE_DOCKER_REGISTRY/$DOCKER_IMAGE:test -f nginx/Dockerfile .
    - docker push $PRODUCTIVE_DOCKER_REGISTRY/$DOCKER_IMAGE:test
  only:
    - main

scan_staging:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  dependencies:
    - assemble_staging
  variables:
    GIT_STRATEGY: none
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    TRIVY_USERNAME: $STAGING_DOCKER_USERNAME
    TRIVY_PASSWORD: $STAGING_DOCKER_PASSWORD
  script:
    - trivy --version
    - time trivy clean --scan-cache
    - time trivy image --download-db-only --no-progress --cache-dir .trivycache/
    - trivy image --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/ $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:test
  cache:
    paths:
      - .trivycache/
  only:
    - dev

scan_productive:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  dependencies:
    - assemble_productive
  variables:
    GIT_STRATEGY: none
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    TRIVY_USERNAME: $PRODUCTIVE_DOCKER_USERNAME
    TRIVY_PASSWORD: $PRODUCTIVE_DOCKER_PASSWORD
  script:
    - trivy --version
    - time trivy clean --scan-cache
    - time trivy image --download-db-only --no-progress --cache-dir .trivycache/
    - trivy image --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/ $PRODUCTIVE_DOCKER_REGISTRY/$DOCKER_IMAGE:test
  cache:
    paths:
      - .trivycache/
  only:
    - main

publish_staging:
  stage: publish
  image: docker:cli
  services:
    - docker:dind
  dependencies:
    - scan_staging
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $STAGING_DOCKER_PASSWORD | docker login -u $STAGING_DOCKER_USERNAME --password-stdin $STAGING_DOCKER_REGISTRY
    - docker pull $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:test
    - docker tag $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:test $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker push $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:latest
  only:
    - dev

publish_productive:
  stage: publish
  image: docker:cli
  services:
    - docker:dind
  dependencies:
    - scan_productive
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $PRODUCTIVE_DOCKER_PASSWORD | docker login -u $PRODUCTIVE_DOCKER_USERNAME --password-stdin $PRODUCTIVE_DOCKER_REGISTRY
    - docker pull $PRODUCTIVE_DOCKER_REGISTRY/$DOCKER_IMAGE:test
    - docker tag $PRODUCTIVE_DOCKER_REGISTRY/$DOCKER_IMAGE:test $PRODUCTIVE_DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker push $PRODUCTIVE_DOCKER_REGISTRY/$DOCKER_IMAGE:latest
  only:
    - main

deploy_staging:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  dependencies:
    - publish_staging
  before_script:
    - mkdir -p ~/.kube
    - echo "$STAGING_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_RESOURCE
    - kubectl rollout status $KUBERNETES_RESOURCE
  only:
    - dev

deploy_productive:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  dependencies:
    - publish_productive
  before_script:
    - mkdir -p ~/.kube
    - echo "$PRODUCTIVE_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_RESOURCE
    - kubectl rollout status $KUBERNETES_RESOURCE
  only:
    - main

merge:
  stage: merge
  image: curlimages/curl:latest
  script:
    - |
      curl --request POST --header "PRIVATE-TOKEN: $DULNO_GITLAB_PRIVATE_TOKEN" \
      --data "source_branch=dev&target_branch=main&title=Production deployment" \
      --data "remove_source_branch=false&squash=true" \
      "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/merge_requests"
  only:
    - dev
  when: on_success