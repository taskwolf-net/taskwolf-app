stages:
  - build
  - assemble
  - scan
  - publish
  - deploy

variables:
  DOCKER_IMAGE: "dulno-app"
  KUBERNETES_RESOURCE: "deployment/dulno-app-deployment"

build_linux:
  stage: build
  image: instrumentisto/flutter:3.29.0
  script:
    - apt-get update && apt-get install -y libsecret-1-dev libnotify-dev libayatana-appindicator3-dev dpkg-dev gnupg apt-utils gzip
    - flutter config --enable-linux-desktop
    - flutter build linux --release
    - mkdir -p linux/deployment/usr/bin/dulno
    - mv build/linux/x64/release/bundle/* linux/deployment/usr/bin/dulno
    - cd linux
    - chmod -R 755 deployment
    - dpkg-deb --build deployment
    - mv deployment.deb dulno.deb
  artifacts:
    paths:
      - linux/dulno.deb
    expire_in: 1 day

build_android:
  stage: build
  image: instrumentisto/flutter:3.29.0-androidsdk34-r0
  before_script:
    - echo $ANDROID_KEYSTORE_CONTENT | base64 -d > android/app/keystore.jks
  script:
    - yes | flutter doctor --android-licenses || true
    - flutter pub run flutter_native_splash:create
    - flutter build appbundle --release
    - mv build/app/outputs/bundle/release/app-release.aab android/dulno.aab
  artifacts:
    paths:
      - android/dulno.aab
    expire_in: 1 day
  only:
    - master

build_windows:
  stage: build
  tags:
    - windows
  script:
    - flutter config --enable-windows-desktop
    - flutter build windows --release
    - Move-Item -Path "build\\windows\\x64\\runner\\Release" -Destination "windows\\deployment\\app"
    - powershell -Command "& 'C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe' windows\\deployment\\dulno.iss"
    - Move-Item -Path "windows\\deployment\\Output\\mysetup.exe" -Destination "windows\\dulno.exe"
  artifacts:
    paths:
      - windows/dulno.exe
    expire_in: 1 day
  only:
    - master

assemble:
  stage: assemble
  image: docker:cli
  services:
    - docker:dind
  dependencies:
    - build_linux
    - build_windows
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin $DOCKER_REGISTRY
    - docker buildx build -t $DOCKER_REGISTRY/$DOCKER_IMAGE:test -f nginx/Dockerfile .
    - docker push $DOCKER_REGISTRY/$DOCKER_IMAGE:test
  only:
    - master

scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  dependencies:
    - assemble
  variables:
    GIT_STRATEGY: none
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    TRIVY_USERNAME: $DOCKER_USERNAME
    TRIVY_PASSWORD: $DOCKER_PASSWORD
  script:
    - trivy --version
    - time trivy clean --scan-cache
    - time trivy image --download-db-only --no-progress --cache-dir .trivycache/
    - trivy image --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/ $DOCKER_REGISTRY/$DOCKER_IMAGE:test
  cache:
    paths:
      - .trivycache/
  only:
    - master

publish:
  stage: publish
  image: docker:cli
  services:
    - docker:dind
  dependencies:
    - scan
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin $DOCKER_REGISTRY
    - docker pull $DOCKER_REGISTRY/$DOCKER_IMAGE:test
    - docker tag $DOCKER_REGISTRY/$DOCKER_IMAGE:test $DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker push $DOCKER_REGISTRY/$DOCKER_IMAGE:latest
  only:
    - master

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  dependencies:
    - publish
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_RESOURCE
    - kubectl rollout status $KUBERNETES_RESOURCE
  only:
    - master